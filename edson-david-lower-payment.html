<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Ivan Silva — Condição especial</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#08090c;color:#f2f4f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:grid;place-items:center;padding:22px;line-height:1.6;
  background-image:radial-gradient(50rem 34rem at 50% -10%,rgba(56,232,168,.10),transparent 62%);
}
.card{
  width:100%;max-width:440px;border-radius:20px;padding:34px 28px;text-align:center;
  background:linear-gradient(168deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 34px 80px -34px #000;
}
.brand{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:#9aa3b2;margin-bottom:22px;
}
.mark{
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(150deg,#38e8a8,#19b98a);color:#04120c;font-weight:800;font-size:13px;letter-spacing:0;
}
h1{font-size:26px;line-height:1.18;letter-spacing:-.03em;font-weight:760;margin-bottom:12px}
p{color:#9aa3b2;font-size:14.5px;margin-bottom:26px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:16px 22px;border-radius:13px;font-weight:680;font-size:15.5px;
  text-decoration:none;transition:transform .18s,box-shadow .2s;margin-bottom:10px;
}
.btn:active{transform:scale(.99)}
.primary{background:linear-gradient(150deg,#38e8a8,#22cf95);color:#04120c;box-shadow:0 10px 34px -12px rgba(56,232,168,.6)}
.ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:#f2f4f8}
.foot{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#666e7b}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark">A</span> Ivan Silva</div>
  <h1>Sua condição de parcela menor ainda está disponível</h1>
  <p>Fale comigo agora e eu verifico o seu caso em poucos minutos.</p>
  <a class="btn primary" href="tel:+19548600537">📞 Ligar para o Ivan</a>
  <a class="btn ghost" href="https://wa.me/19548600537">💬 Chamar no WhatsApp</a>
  <div class="foot">Ivan Silva · South Florida · (954) 860-0537</div>
</div>
</body>
</html>
