function store(k,v){try{v===undefined?null:localStorage.setItem(k,v);return localStorage.getItem(k)}catch(e){return null}}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function setLang(l){
  if(!T[l]) l="en";
  const d=T[l];
  document.documentElement.lang=l;
  document.title=d.title;
  document.querySelector('meta[name="description"]').setAttribute("content",d.desc);
  document.querySelectorAll("[data-i]").forEach(el=>{
    const v=d[el.dataset.i]; if(v==null) return;
    if(el.hasAttribute("data-html")) el.innerHTML=v; else el.textContent=v;
  });
  document.querySelectorAll("[data-i-aria]").forEach(el=>el.setAttribute("aria-label",d[el.dataset.iAria]));
  const wa=WA+encodeURIComponent(d.waMsg);
  document.querySelectorAll("a.wa").forEach(a=>a.href=wa);
  const packs=document.getElementById("packs");packs.replaceChildren();
  d.packs.forEach(p=>{
    const c=mk("article","panel pack"+(p.r?" rec":""));
    if(p.r) c.append(mk("span","tag",d.rec));
    c.append(mk("h3",null,p.n),mk("span","from",d.from));
    const pr=mk("div","price",p.price||p.p); if(p.m){pr.append(mk("small",null,d.mo))}
    c.append(pr);
    const ul=mk("ul");p.i.forEach(x=>ul.append(mk("li",null,x)));c.append(ul);
    const b=mk("a","btn"+(p.r?"":" ghost"),d.ask);b.href="#contact";b.dataset.pack=p.n;b.addEventListener("click",()=>{const ps=document.getElementById("fPackSel");ps.value=p.n});c.append(b);
    packs.append(c);
  });
  const rules=document.getElementById("rules");rules.replaceChildren();
  d.rules.forEach(r=>{const c=mk("div","panel");const p=mk("p");p.append(mk("b",null,r[0]+" "),document.createTextNode(r[1]));c.append(p);rules.append(c)});
  const faq=document.getElementById("faqList");faq.replaceChildren();
  d.faq.forEach(f=>{const dt=mk("details");dt.append(mk("summary",null,f[0]),mk("p",null,f[1]));faq.append(dt)});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===l)));
  const bs=document.getElementById("fBizSel");bs.replaceChildren();
  d.bizOpts.forEach((o,k)=>{const op=mk("option",null,o);op.value=k?o:"";if(!k){op.disabled=true;op.selected=true}bs.append(op)});
  const ps=document.getElementById("fPackSel");const keep=ps.value;ps.replaceChildren();
  const n0=mk("option",null,d.packNone);n0.value="";ps.append(n0);
  d.packs.forEach(p=>{const op=mk("option",null,p.n+" ("+p.p+(p.m?d.mo:"")+")");op.value=p.n;ps.append(op)});
  document.getElementById("fLang").value=l;
  store("askivan_lang",l);
}
